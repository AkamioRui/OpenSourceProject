<div class="modal" id="popup-login">
  <div class="modal-content">
    <app-navbar data-page="login-nav"></app-navbar>

    <span class="close-btn">&times;</span>

    <div class="login-card">
      <h2>WELCOME BACK!</h2>

      <form method="POST">
        <label for="email">Email / Username</label>
        <input id="email" name="email" type="text" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required />

        <span class="alt-link">
          <a href="#" id="signup-from-login" onclick="redirect_SignUp()">Don't have an account?</a>
        </span>
      </form>
      <button id="sign-in-button" onclick="login()">Log in</button>
    </div>
  </div>
</div>

<script>
  function login() {
    if (modalName === "login") {
      const signupLink = modal.querySelector("#signup-from-login");
      if (signupLink) {
        signupLink.addEventListener("click", () => {
          console.log("Signup link clicked");
          closeModal();
          loadModal("signup");
        });
      }

      //~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ LOGIN BUTTON HANDLER ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
      const loginButton = modal.querySelector("#sign-in-button");
      if (loginButton) {
        loginButton.addEventListener("click", async () => {
          console.log("Login button:", loginButton);
          let user_arg = document.querySelector("#email").value;
          let user_password = document.querySelector("#password").value;
          console.log(`User arg: ${user_arg}, Password: ${user_password}`);

          //~~~~~~~~~~~~~~~~~~~~~~~~~~~~~  FETCH QUERY FROM FORM ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
          let form = new FormData();
          form.append("query_Login", 1);
          form.append("user_arg", user_arg);
          form.append("user_password", user_password);

          let response = await (
            await fetch("/module/SQL_on_PHP/LOGINPOPUP_LISTENER.php", {
              method: "POST",
              body: form,
            })
          ).text();
          // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ PROFILE PIC APPEND ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
          loadProfilePic();
          closeModal();
        });
      }
    }
  }

  function redirect_SignUp(){
    closeModal();
    loadModal("signup");
 }
</script>

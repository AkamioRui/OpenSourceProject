<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Post - LetMeKnow</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="/src/css/global.css" rel="stylesheet" />
    <link href="/src/css/nav.css" rel="stylesheet" />
    <link href="/src/css/footer.css" rel="stylesheet" />
    <link href="/src/css/post.css" rel="stylesheet" />

    <script src="/src/components/navbar.js"></script>
    <script src="/src/components/footer.js"></script>
  </head>
  <body>
    <app-navbar data-page="post-nav"></app-navbar>

    <main style="--forum_id: $forum_id">
      <section class="post-card">
        <div class="top-card">
          <div class="left-section">
            <h2 class="post-title">$post_title</h2>
            <img
              class="post-like-img"
              src="/src/assets/heart.png"
              alt=""
              srcset=""
            />
          </div>
          <div class="right-section">
            <h2 class="post-username">$post_creatorName</h2>
            <p class="post-like">
              Liked by ! <span class="like"> $post_like</span>
            </p>
          </div>
        </div>

        <div class="content">
          <p class="post-date">$post_createdAt</p>
          <p class="post-desc">$post_contents</p>
        </div>
        <div class="img-container">
          <img src="$postPicture_picture" alt="" class="post-img" />
        </div>
      </section>

      <section class="comment-section">
        <div class="container-comment">
          <div class="comment-header">
            <h2 class="comment-title">Comments</h2>
            <p class="comment-motto">
              “Comments are the footprints of thinking minds.”<br />
              <span>- ChatGPT</span>
            </p>
          </div>

          <ul class="comment-list">
            <li class="comment">
              <img
                src="/src/assets/profile.png"
                alt=""
                class="comment-avatar"
              />
            </li>
          </ul>
        </div>
      </section>
    </main>

    <app-footer data-page="post-footer"></app-footer>
    <div id="modal" class="modal hidden"></div>
    <script src="/src/components/modalLoader.js"></script>

    <script>
      async function fetch_CreateComment(postId, parentId) {
        let form = new FormData();
        form.append("postId", postId);
        form.append("parentId", parentId);

        loadModal("commentbar", form);
      }
      async function footerFunction() {
        fetch_CreateComment($post_id, 0);
      }
    </script>
  </body>
</html>

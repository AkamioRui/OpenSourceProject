<!DOCTYPE html>
<html lang="en">
  <head>
    <title></title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="/src/css/homepage.css" rel="stylesheet" />
    <link href="/src/css/global.css" rel="stylesheet" />
    <link href="/src/css/nav.css" rel="stylesheet" />
    <link href="/src/css/footer.css" rel="stylesheet" />
    <script src="/src/components/navbar.js"></script>
    <script src="/src/components/footer.js"></script>
  </head>
  <body>
    <app-navbar></app-navbar>

    <main>
      <div class="card-container">
        <div class="top-card">
          <img alt="{{FORUM.ICON}}" class="card-photo" />
          <div class="card-heading">
            <h2 class="card-title">{{FORUM.NAME}}</h2>
            <span class="card-contribution">{{FORUM.CONTRIBUTOR}}</span>
          </div>
          <p class="card-desc">{{FORUM.DESCRIPTION}}</p>
        </div>

        <div class="bottom-card">
          <div class="card-content">
            <h3 class="post-title">{{POST.TITLE}}</h3>
            <p class="post-desc">{{POST.DESCRIPTION}}</p>
          </div>

          <div class="card-content">
            <h3 class="post-title">{{POST.TITLE}}</h3>
            <p class="post-desc">{{POST.DESCRIPTION}}</p>
          </div>

          <div class="card-content">
            <h3 class="post-title">{{POST.TITLE}}</h3>
            <p class="post-desc">{{POST.DESCRIPTION}}</p>
          </div>
        </div>
      </div>
    </main>

    <app-footer></app-footer>
  </body>
</html>



<html>
    <body>
    <script type="text/javascript">
        async function sendPost(){
            //assign by php
            // $forum_id; 

            
            
            //create form body
            let formbody = new FormData();
            formbody.append('submit','submit');
            formbody.append('forum_id',$forum_id);
            formbody.append('post_title',document.querySelector("#title").value);
            formbody.append('post_contents',document.querySelector("#description").value);
            for( let file of document.querySelector("#images").files){
                formbody.append('postPicture_picture[]',file);
            }

            //send request
            let response = await fetch('/module/SQL_on_PHP/CREATEPOST_LISTENER.php',{
                method:"POST",
                body:formbody
            });
            let msg = await response.text();
                
            
            //process response
            let parser = new DOMParser();
            let msgdoc = parser.parseFromString(msg,'text/html');
            for( let element of msgdoc.children){
                document.body.appendChild(element);
            }
              

        }

        

    </script>
    <input id="title" type="text"><br>
    <input id="description" type="text"><br>
    <input id="images" type="file" accept="image/*" multiple><br>
    <button onclick="sendPost()">submit</button><br>
    </body>
</html>
